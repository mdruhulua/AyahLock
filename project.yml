# XcodeGen spec. On a Mac run:  xcodegen generate
# It creates AyahLock.xcodeproj from this file.
name: AyahLock
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""   # pick your Personal Team in Xcode > Signing & Capabilities
targets:
  AyahLock:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - AyahLockTests
    sources:
      - App
      - Shared
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AyahLock
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/AyahLock.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.ayahlock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ayahlock
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AyahLockWidget
  AyahLockWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: AyahLock Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/AyahLockWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.ayahlock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ayahlock.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
  AyahLockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AyahLock
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ayahlock.tests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AyahLock.app/AyahLock"
        BUNDLE_LOADER: "$(TEST_HOST)"
